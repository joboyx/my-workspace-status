version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # release.yml is generated by `dist generate` (cargo-dist owns its action
  # versions). If a Dependabot pull request still touches it, close it and
  # regenerate instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    exclude-paths:
      - .github/workflows/release.yml
    ignore:
      # The ref is the toolchain version, pinned to rust-toolchain.toml.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
