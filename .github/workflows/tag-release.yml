# Cut a vX.Y.Z tag on every push to main so cargo-dist's Release workflow can
# publish GitHub Release artifacts.
#
# A GITHUB_TOKEN tag push does not start other workflows (GitHub recursion
# guard). After pushing the tag this job dispatches release.yml. Keep
# `on.workflow_dispatch` on the generated Release workflow after `dist generate`.
name: tag-release

on:
  push:
    branches: [main]

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag and dispatch Release
        run: |
          set -euo pipefail
          # Fetches tags, picks the next free version, pushes main and the
          # tag atomically, and prints the version (nothing on a skip).
          # Behaviour tests: crates/workspace-status/tests/tag_release.rs.
          version=$(bash scripts/tag-release.sh)
          if [[ -z "$version" ]]; then
            echo "skip: no new tag, no Release dispatch"
            exit 0
          fi
          gh workflow run release.yml --ref "v${version}"
