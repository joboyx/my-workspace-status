# Cut a vX.Y.Z tag on every push to main so cargo-dist's Release workflow can
# publish GitHub Release artifacts.
#
# A GITHUB_TOKEN tag push does not start other workflows (GitHub recursion
# guard). After pushing the tag this job dispatches release.yml. Keep
# `on.workflow_dispatch` on the generated Release workflow after `dist generate`.
name: tag-release

on:
  push:
    branches: [main]

concurrency:
  group: tag-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag and dispatch Release
        run: |
          set -euo pipefail
          git fetch --tags origin

          msg=$(git log -1 --pretty=%s)
          if [[ "$msg" == "chore(release):"* ]]; then
            echo "skip: incoming commit is already chore(release):"
            exit 0
          fi

          if exact=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            if [[ "$exact" == v* ]]; then
              echo "skip: HEAD is already tagged $exact"
              exit 0
            fi
          fi

          version=$(awk '/^version = / { gsub(/"/, "", $3); print $3; exit }' crates/workspace-status/Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "could not read crates/workspace-status/Cargo.toml version" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            IFS=. read -r major minor patch <<<"$version"
            new="${major}.${minor}.$((patch + 1))"
            for f in crates/workspace-status/Cargo.toml crates/workspace-status-graph/Cargo.toml; do
              sed -i "s/^version = \"${version}\"/version = \"${new}\"/" "$f"
            done
            # Keep workspace package versions in Cargo.lock in lockstep.
            awk -v old="$version" -v new="$new" '
              $0 == "name = \"workspace-status\"" { hit = 1 }
              $0 == "name = \"workspace-status-graph\"" { hit = 1 }
              hit && $0 ~ /^version = "/ {
                sub("version = \"" old "\"", "version = \"" new "\"")
                hit = 0
              }
              { print }
            ' Cargo.lock > Cargo.lock.next
            mv Cargo.lock.next Cargo.lock
            git add crates/workspace-status/Cargo.toml crates/workspace-status-graph/Cargo.toml Cargo.lock
            git commit -m "chore(release): v${new}"
            version="$new"
          fi

          git tag -a "v${version}" -m "v${version}"
          git push origin HEAD:main "v${version}"
          gh workflow run release.yml --ref "v${version}"
