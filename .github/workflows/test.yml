# Checks for pull requests and main, then the release of a green main commit.
#
# Every job before `release-gate` is a check. `release-gate` needs all of
# them, and the main ruleset should require each check by job name (list in
# docs/architecture.md, Release gate). CI:
# crates/workspace-status/tests/release_gate.rs.
#
# `--all-features` turns on the `slow-tests` feature: the PTY e2e and the
# watch-tick load test run here, before merge, and not in the local gate.
name: test

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default. A job that needs more sets its own permissions.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: cargo test --workspace --locked --all-features

  # Releases ship macOS and Windows builds (dist-workspace.toml targets), so
  # the full suite also runs on those platforms before a release.
  cargo-macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: cargo test --workspace --locked --all-features

  # The PTY e2e is Unix only: on Windows that test crate compiles with no
  # tests, so the explicit build step keeps every target compiling.
  cargo-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # Keep LF line endings: some tests compare checked-in text files.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - run: cargo build --workspace --all-targets --all-features --locked
      # Windows failures reproduce only here, so one run shows every failing
      # test binary.
      - run: cargo test --workspace --locked --all-features --no-fail-fast

  tui-tty-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - name: Install desktop TTY packages
        run: |
          # ubuntu-latest ships Chrome as google-chrome.list and
          # google-chrome.sources. A stale Chrome Packages.gz hash fails
          # apt-get update and skips the e2e. The .list delete alone is
          # not enough: apt still reads the DEB822 .sources file.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.list.save \
            /etc/apt/sources.list.d/google-chrome.sources \
            /etc/apt/sources.list.d/google-chrome.sources.save
          sudo find /etc/apt/sources.list.d -iname '*chrome*' -delete || true
          sudo grep -RIl 'dl.google.com' /etc/apt/sources.list \
            /etc/apt/sources.list.d 2>/dev/null \
            | sudo xargs -r rm -f || true
          sudo find /var/lib/apt/lists -iname '*chrome*' -delete || true
          sudo find /var/lib/apt/lists -iname '*dl.google.com*' -delete || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xfce4-terminal xterm xdotool dbus-x11 openbox
      - name: Desktop TTY e2e (xfce keys + xterm XTEST wheel)
        run: |
          ./scripts/with-desktop-session.sh --auto -- \
            cargo test -p workspace-status --features slow-tests --test tui_tty_e2e -- --ignored --nocapture --test-threads=1

  # Release a main push only after every check passed, and only while that
  # commit is still the tip of main. When a newer merge landed during the
  # checks, this run skips and the newer merge's run releases when its
  # checks pass.
  release-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, cargo, cargo-macos, cargo-windows, tui-tty-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [[ "$tip" == "$GITHUB_SHA" ]]; then
            echo "current=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip: main moved from $GITHUB_SHA to $tip; the newer run releases"
            echo "current=false" >>"$GITHUB_OUTPUT"
          fi

  release:
    needs: release-gate
    if: needs.release-gate.outputs.current == 'true'
    permissions:
      contents: write
      actions: write
    # A job that calls a reusable workflow cannot set timeout-minutes; the
    # `tag` job of tag-release.yml sets it.
    uses: ./.github/workflows/tag-release.yml
    # The `release` environment secret RELEASE_DEPLOY_KEY reaches the called
    # workflow only with `inherit`.
    secrets: inherit
