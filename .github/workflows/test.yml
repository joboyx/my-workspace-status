name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  tui-tty-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop TTY packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xfce4-terminal xterm xdotool dbus-x11 openbox
      - name: Desktop TTY e2e (xfce keys + xterm XTEST wheel)
        run: |
          ./scripts/with-desktop-session.sh --auto -- \
            cargo test --test tui_tty_e2e -- --ignored --nocapture --test-threads=1
