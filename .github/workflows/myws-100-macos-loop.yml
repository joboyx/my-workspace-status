# TEMPORARY (MYWS-100): repeat the macOS lib suite to measure the flaky
# title-command test. Removed before merge.
name: myws-100-macos-loop

on:
  push:
    branches: [bugfix/MYWS-100-flaky-title-command-test]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - run: cargo test -p workspace-status --lib --locked --all-features --no-run
      - name: Full lib suite, 6 runs
        env:
          MYWS100_DURATIONS: ${{ runner.temp }}/durations.txt
          MYWS100_TRACE: ${{ runner.temp }}/trace.txt
        run: |
          set -u
          test='tui::pr_groups::tests::title_command::a_command_with_a_lot_of_output_is_not_stalled'
          pass=0; fail=0; missing=0
          for n in 1 2 3 4 5 6; do
            : >"$MYWS100_TRACE"
            cargo test -p workspace-status --lib --locked --all-features 2>&1 \
              | perl -MTime::HiRes=time -ne '$|=1; printf "%.3f %s", time, $_' >"run-$n.log" || true
            grep 'test result:' "run-$n.log" || true
            if grep -qF "test $test ... ok" "run-$n.log"; then
              pass=$((pass+1))
            elif grep -qF "test $test ... FAILED" "run-$n.log"; then
              fail=$((fail+1))
              echo "--- run $n: tests around the failure (epoch seconds)"
              grep -B12 -A8 -F "test $test ... FAILED" "run-$n.log" || true
              grep -A6 -F -- "---- $test stdout" "run-$n.log" || true
              echo "--- run $n: title-command runs with the 2 s limit that ended later than 1 s"
              awk '$1=="limit=2000ms" { split($6, e, "[=m]"); if (e[2] > 1000) print }' "$MYWS100_TRACE" || true
              echo "--- run $n: all 2 s runs that timed out"
              grep 'limit=2000ms.*outcome=timeout' "$MYWS100_TRACE" || true
            else
              missing=$((missing+1))
            fi
            grep -E ' test .* \.\.\. FAILED' "run-$n.log" || true
          done
          ms=$(cut -d' ' -f1 "$MYWS100_DURATIONS" | sort -n)
          summary="shard ${{ matrix.shard }}: target test pass=$pass fail=$fail missing=$missing; probe ms min=$(echo "$ms" | head -1) max=$(echo "$ms" | tail -1) all=[$(echo $ms)]"
          echo "$summary"
          echo "$summary" >>"$GITHUB_STEP_SUMMARY"
          [ "$fail" -eq 0 ] && [ "$missing" -eq 0 ]
