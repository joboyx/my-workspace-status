[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Only the CLI crate is an app; workspace-status-graph is a path library bundled into it.
packages = ["workspace-status"]
# Path that installers should place binaries in (XDG user bin; no rustup PATH)
install-path = "~/.local/bin"
# Whether to install an updater program
install-updater = true
# Keep tag-triggered Release CI plus workflow_dispatch (see tag-release.yml).
# GITHUB_TOKEN tag pushes do not start other workflows.
# Also keeps git-cliff notes on the generated Release workflow (cliff.toml).
# After `dist generate`, restore those host steps. Recipe: docs/architecture.md.
# Do not set dispatch-releases = true (that drops tag-push).
allow-dirty = ["ci"]
# GitHub Releases only: do not add Homebrew taps or crates.io publish jobs.
