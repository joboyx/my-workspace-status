[package]
name = "workspace-status"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Headless workspace-status CLI (--plain / --json snapshot)"
readme = "README.md"

[[bin]]
name = "workspace-status"
path = "src/bin/workspace-status.rs"

[[bin]]
name = "ws"
path = "src/bin/ws.rs"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
