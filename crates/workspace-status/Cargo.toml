[package]
name = "workspace-status"
version = "0.1.321"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Workspace git status: ratatui TUI plus --plain / --json snapshot"
readme = "README.md"

[[bin]]
name = "workspace-status"
path = "src/bin/workspace-status.rs"

[[bin]]
name = "ws"
path = "src/bin/ws.rs"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
crossterm = "0.28.1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tokio = { version = "1.47.1", features = ["rt", "macros", "sync", "time"] }
workspace-status-graph = { path = "../workspace-status-graph" }
sha2 = "0.11"
tui-textarea = "0.7"
# Same release ratatui 0.29 measures spans with, so a help cell cut counts
# columns the way it paints.
unicode-width = "0.2.0"
fs4 = "1.1"
# Held at 0.4.5, with plist 1.7.4 and time 0.3.36 in Cargo.lock: holds from the
# old rustc 1.85 floor. plist 1.9+ and time 0.3.46+ declare rustc 1.88, so the
# floor no longer blocks them. Moving these crates is a separate bump.
two-face = { version = "0.4.5", default-features = false, features = ["syntect-default-fancy"] }
# 0.3.1 declares no rust-version; deps memchr / unicode-segmentation are
# already locked at versions that build on 1.88.
nucleo-matcher = "0.3.1"
# Search in files runs ripgrep's engine in process. These releases build on
# rustc 1.88. Cargo.lock keeps encoding_rs at 0.8.35, a hold from the old rustc
# 1.85 floor. 0.8.40+ declares rustc 1.88, so the floor no longer blocks it.
# Moving it is a separate bump.
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.15"
workspace-status-graph = { path = "../workspace-status-graph", features = ["paint-probe"] }

[lints]
workspace = true
