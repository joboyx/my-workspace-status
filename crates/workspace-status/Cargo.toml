[package]
name = "workspace-status"
version = "0.1.205"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Workspace git status: ratatui TUI plus --plain / --json snapshot"
readme = "README.md"

[[bin]]
name = "workspace-status"
path = "src/bin/workspace-status.rs"

[[bin]]
name = "ws"
path = "src/bin/ws.rs"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
crossterm = "0.28.1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tokio = { version = "1.47.1", features = ["rt", "macros", "sync", "time"] }
workspace-status-graph = { path = "../workspace-status-graph" }
sha2 = "0.10.8"
tui-textarea = "0.7"
fs4 = "0.13"
# 0.4.5 stays on rustc 1.85. 0.5 needs a newer compiler. Cargo.lock pins
# plist 1.7.4 and time 0.3.36 so syntect 5.3 does not pull 1.88-only crates.
two-face = { version = "0.4.5", default-features = false, features = ["syntect-default-fancy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
portable-pty = "0.8"
vt100 = "0.15"

[lints]
workspace = true
