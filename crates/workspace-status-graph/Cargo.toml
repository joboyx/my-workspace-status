[package]
name = "workspace-status-graph"
version = "0.1.322"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Ratatui widget for the workspace-status git graph"
readme = "README.md"

[dependencies]
libc = "0.2"
# std: with default features off, 0.30 builds for no_std. This crate runs on a host.
ratatui = { version = "0.30", default-features = false, features = ["std"] }

[features]
# Test-only paint call counter (`paint_calls`); keep off in release builds.
paint-probe = []

[lints]
workspace = true
