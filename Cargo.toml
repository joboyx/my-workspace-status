[workspace]
resolver = "2"
members = ["crates/workspace-status-graph", "crates/workspace-status"]

[workspace.lints.clippy]
# Known debt, not a blanket exemption. Nine wide signatures remain, named
# by function (line numbers drift): in the graph crate `layout.rs::paint_cells`
# and `widget.rs::put_painted_line`; in the app crate
# `tui/comments/target.rs::{resolve_comment_target, resolve_entity_reference}`,
# `tui/diff.rs::diff_pane_header`, and `tui/render.rs::{paint_tree_row,
# paint_segmented_row, paint_diff_row, paint_cell_spans}`. Each wants a
# params-struct. Drop this line once they are done.
too_many_arguments = "allow"
# Five enums trip this lint: `JobOutcome` (`tui/effect.rs`, largest variant
# 808 bytes), `SessionTab` (`tui/tabs.rs`, 1120), `PrDetailLookup`
# (`tui/pull_request.rs`, 288), `PrDetailState` and `BranchPr`
# (`tui/state/pull_request.rs`, 288 and 208). Boxing the large variants
# touches every construction site, so it is its own change.
large_enum_variant = "allow"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/joboyx/my-workspace-status"
rust-version = "1.88"

# Keep integer overflow checks on in release builds, as in dev and test.
# Without them a `usize` subtraction that goes below zero wraps silently, and
# a later `" ".repeat(n)` panics with `capacity overflow` inside the standard
# library, with no `ws` file or line. With them the panic names the line of
# the subtraction. The tests already run with the checks on, so code that
# passes them does not rely on wrapping.
[profile.release]
overflow-checks = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Line tables keep file:line in panic backtraces but drop variable info,
# which cuts link time and target/ size. Set on dev so `cargo build`,
# `cargo run` and `cargo test` (the test profile inherits dev) keep sharing
# dependency builds. For a debugger session, set CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

# syntect's fancy-regex backend is very slow unoptimized. Keep debug/test
# highlighting usable without switching to Oniguruma.
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.two-face]
opt-level = 3
[profile.test.package.fancy-regex]
opt-level = 3
[profile.test.package.regex-automata]
opt-level = 3
[profile.test.package.syntect]
opt-level = 3
[profile.test.package.two-face]
opt-level = 3
